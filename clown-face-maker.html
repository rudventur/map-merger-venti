<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clown Face Maker – Final</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin: 0 0 4px 0; font-size: 1.6rem; }
    .sub { color: #aaa; font-size: .85rem; margin-bottom: 14px; text-align: center; max-width: 560px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      justify-content: center;
      margin-bottom: 14px;
      background: #16213e;
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 1000px;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 12.5px;
      gap: 3px;
    }
    select, input[type="text"], button, .checkbox-label {
      padding: 6px 9px;
      border-radius: 6px;
      border: none;
      background: #0f3460;
      color: white;
      font-size: 13px;
    }
    button {
      cursor: pointer;
      background: #e94560;
      font-weight: 600;
    }
    button:hover { background: #ff6b81; }
    button.save { background: #ff69b4; }
    button.save:hover { background: #ff8ac4; }
    .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    #face-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #face-container {
      width: 340px;
      height: 340px;
      background: #0f3460;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(255, 100, 150, 0.35);
    }
    svg { width: 300px; height: 300px; }
    .hidden { display: none !important; }
    #bubble-text {
      width: 140px;
    }
    #saveStatus {
      min-height: 1.2em;
      font-size: .85rem;
      color: #7CFC98;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>🤡 Clown Face Maker</h1>
  <div class="sub">Design your clown once here. "Save as My Clown" stores it in this browser, so your Clown-Walk avatar on Map Merger Venti (and your clown on Snout First) uses this face instead of the plain 🤡 emoji.</div>

  <div class="controls">
    <label>
      Sex
      <select id="sex">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="neutral">Neutral</option>
      </select>
    </label>

    <label>
      Base Skin
      <select id="skinbase">
        <option value="#f1c27d">Light</option>
        <option value="#e0ac69" selected>Medium</option>
        <option value="#c68642">Tan</option>
        <option value="#8d5524">Brown</option>
        <option value="#5c3317">Deep</option>
        <option value="#f5d0c5">Pale Pink</option>
        <option value="#d4a574">Olive</option>
      </select>
    </label>

    <label>
      Tone
      <select id="skintone">
        <option value="darker">Darker</option>
        <option value="normal" selected>Normal</option>
        <option value="brighter">Brighter</option>
      </select>
    </label>

    <label>
      Face Shape
      <select id="faceshape">
        <option value="round">Round</option>
        <option value="oval">Oval</option>
        <option value="square">Square</option>
        <option value="heart">Heart</option>
        <option value="long">Long</option>
      </select>
    </label>

    <label>
      Hair Style
      <select id="hair">
        <option value="bald">Bald</option>
        <option value="baldfront">Bald Front</option>
        <option value="spiky">Spiky</option>
        <option value="mohawk">Mohawk</option>
        <option value="curly">Curly</option>
        <option value="afro">Afro</option>
        <option value="pigtails">Pigtails</option>
      </select>
    </label>

    <label>
      Hair Colour
      <select id="haircolor">
        <option value="#222222">Black</option>
        <option value="#5d4037">Brown</option>
        <option value="#8d6e63">Light Brown</option>
        <option value="#f48fb1">Pink</option>
        <option value="#ff1744">Red</option>
        <option value="#ffeb3b">Yellow</option>
        <option value="#4caf50">Green</option>
        <option value="#2196f3">Blue</option>
        <option value="#9c27b0">Purple</option>
        <option value="#ffffff">White</option>
        <option value="#ff9800">Orange</option>
      </select>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" id="symmetrical" checked>
      Symmetrical Makeup
    </label>

    <label id="makeup-label">
      Makeup
      <select id="makeup">
        <option value="classic">Classic Clown</option>
        <option value="heavy">Heavy</option>
        <option value="sparkly">Sparkly</option>
        <option value="tears">Tears</option>
        <option value="gothic">Gothic</option>
        <option value="none">None</option>
      </select>
    </label>

    <label id="makeup-left-label" class="hidden">
      Left Makeup
      <select id="makeup-left">
        <option value="classic">Classic</option>
        <option value="heavy">Heavy</option>
        <option value="sparkly">Sparkly</option>
        <option value="tears">Tears</option>
        <option value="gothic">Gothic</option>
        <option value="none">None</option>
      </select>
    </label>

    <label id="makeup-right-label" class="hidden">
      Right Makeup
      <select id="makeup-right">
        <option value="classic">Classic</option>
        <option value="heavy">Heavy</option>
        <option value="sparkly">Sparkly</option>
        <option value="tears">Tears</option>
        <option value="gothic">Gothic</option>
        <option value="none">None</option>
      </select>
    </label>

    <label>
      Nose
      <select id="nose">
        <option value="round">Big Red Round</option>
        <option value="pointy">Pointy</option>
        <option value="small">Small Red</option>
        <option value="button">Button</option>
        <option value="at">@ Shape</option>
      </select>
    </label>

    <label>
      Smile
      <select id="smile">
        <option value="closed">Closed</option>
        <option value="open">Open</option>
        <option value="cheeky">Cheeky</option>
        <option value="flat">Flat</option>
        <option value="wobbly">Wobbly</option>
        <option value="unsmiley">Unsmiley</option>
        <option value="sad">Sad</option>
        <option value="angry">Angry</option>
      </select>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" id="bubble">
      Speech Bubble
    </label>

    <label>
      Bubble Text (max 20)
      <input type="text" id="bubble-text" maxlength="20" placeholder="Hello!">
    </label>

    <button onclick="randomise()">🎲 Randomise</button>
    <button onclick="downloadPNG()">⬇ Download PNG</button>
    <button class="save" onclick="saveAsClown()">💾 Save as My Clown</button>
  </div>

  <div id="face-wrapper">
    <div id="face-container">
      <svg id="face" viewBox="0 0 200 200"></svg>
    </div>
  </div>
  <div id="saveStatus"></div>

  <script>
    const svg = document.getElementById('face');
    const symmetrical = document.getElementById('symmetrical');
    const makeupLabel = document.getElementById('makeup-label');
    const leftLabel = document.getElementById('makeup-left-label');
    const rightLabel = document.getElementById('makeup-right-label');

    const FACE_FIELD_IDS = [
      'sex', 'skinbase', 'skintone', 'faceshape', 'hair', 'haircolor',
      'makeup', 'makeup-left', 'makeup-right', 'nose', 'smile'
    ];
    const CONFIG_KEY = 'rv_clown_face_config';
    const SVG_KEY = 'rv_clown_face_svg';

    symmetrical.addEventListener('change', () => {
      if (symmetrical.checked) {
        makeupLabel.classList.remove('hidden');
        leftLabel.classList.add('hidden');
        rightLabel.classList.add('hidden');
      } else {
        makeupLabel.classList.add('hidden');
        leftLabel.classList.remove('hidden');
        rightLabel.classList.remove('hidden');
      }
      draw();
    });

    function adjustTone(hex, tone) {
      // simple brightness adjust
      let r = parseInt(hex.slice(1,3),16);
      let g = parseInt(hex.slice(3,5),16);
      let b = parseInt(hex.slice(5,7),16);
      if (tone === 'darker') {
        r = Math.max(0, r - 40);
        g = Math.max(0, g - 40);
        b = Math.max(0, b - 40);
      } else if (tone === 'brighter') {
        r = Math.min(255, r + 45);
        g = Math.min(255, g + 45);
        b = Math.min(255, b + 45);
      }
      return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
    }

    function getMakeupStyle(type) {
      if (type === 'none') return { cheek: 'none', eyeshadow: 'none', tear: false };
      if (type === 'classic') return { cheek: '#ff6b6b', eyeshadow: '#fff', tear: false };
      if (type === 'heavy') return { cheek: '#ff2e63', eyeshadow: '#ff9ff3', tear: false };
      if (type === 'sparkly') return { cheek: '#ff9ff3', eyeshadow: '#54a0ff', tear: false };
      if (type === 'tears') return { cheek: '#74b9ff', eyeshadow: '#a29bfe', tear: true };
      if (type === 'gothic') return { cheek: '#2d3436', eyeshadow: '#6c5ce7', tear: false };
      return { cheek: 'none', eyeshadow: 'none', tear: false };
    }

    function draw() {
      const sex = document.getElementById('sex').value;
      const baseSkin = document.getElementById('skinbase').value;
      const tone = document.getElementById('skintone').value;
      const skin = adjustTone(baseSkin, tone);
      const faceshape = document.getElementById('faceshape').value;
      const hair = document.getElementById('hair').value;
      const hairColor = document.getElementById('haircolor').value;
      const nose = document.getElementById('nose').value;
      const smile = document.getElementById('smile').value;
      const showBubble = document.getElementById('bubble').checked;
      const bubbleText = document.getElementById('bubble-text').value || 'Hello!';

      // Makeup
      let leftType, rightType;
      if (symmetrical.checked) {
        leftType = rightType = document.getElementById('makeup').value;
      } else {
        leftType = document.getElementById('makeup-left').value;
        rightType = document.getElementById('makeup-right').value;
      }
      const leftM = getMakeupStyle(leftType);
      const rightM = getMakeupStyle(rightType);

      // Face shape
      let headSVG = '';
      if (faceshape === 'round') {
        headSVG = `<circle cx="100" cy="100" r="80" fill="${skin}" stroke="#e0a060" stroke-width="2"/>`;
      } else if (faceshape === 'oval') {
        headSVG = `<ellipse cx="100" cy="100" rx="72" ry="88" fill="${skin}" stroke="#e0a060" stroke-width="2"/>`;
      } else if (faceshape === 'square') {
        headSVG = `<rect x="28" y="28" width="144" height="144" rx="28" ry="28" fill="${skin}" stroke="#e0a060" stroke-width="2"/>`;
      } else if (faceshape === 'heart') {
        headSVG = `<path d="M100 175 C40 130, 20 80, 45 55 C70 30, 100 45, 100 70 C100 45, 130 30, 155 55 C180 80, 160 130, 100 175 Z" fill="${skin}" stroke="#e0a060" stroke-width="2"/>`;
      } else if (faceshape === 'long') {
        headSVG = `<ellipse cx="100" cy="105" rx="68" ry="95" fill="${skin}" stroke="#e0a060" stroke-width="2"/>`;
      }

      // Hair
      let hairSVG = '';
      if (hair === 'spiky') {
        hairSVG = `
          <polygon points="40,70 55,18 70,70" fill="${hairColor}"/>
          <polygon points="70,65 90,12 110,65" fill="${hairColor}"/>
          <polygon points="110,70 130,18 145,70" fill="${hairColor}"/>
        `;
      } else if (hair === 'mohawk') {
        hairSVG = `
          <polygon points="85,12 100,2 115,12 110,75 90,75" fill="${hairColor}"/>
          <polygon points="92,18 100,10 108,18 105,70 95,70" fill="${hairColor}" opacity="0.7"/>
        `;
      } else if (hair === 'baldfront') {
        hairSVG = `
          <path d="M35,85 Q50,40 100,35 Q150,40 165,85" fill="${hairColor}"/>
          <path d="M45,90 Q60,55 100,50 Q140,55 155,90" fill="${hairColor}" opacity="0.85"/>
        `;
      } else if (hair === 'curly') {
        hairSVG = `
          <circle cx="50" cy="55" r="22" fill="${hairColor}"/>
          <circle cx="80" cy="40" r="25" fill="${hairColor}"/>
          <circle cx="120" cy="40" r="25" fill="${hairColor}"/>
          <circle cx="150" cy="55" r="22" fill="${hairColor}"/>
        `;
      } else if (hair === 'afro') {
        hairSVG = `<circle cx="100" cy="55" r="72" fill="${hairColor}"/>`;
      } else if (hair === 'pigtails') {
        hairSVG = `
          <circle cx="38" cy="85" r="26" fill="${hairColor}"/>
          <circle cx="162" cy="85" r="26" fill="${hairColor}"/>
          <rect x="28" y="75" width="20" height="45" fill="${hairColor}"/>
          <rect x="152" y="75" width="20" height="45" fill="${hairColor}"/>
        `;
      }

      // Ears
      const ears = `
        <ellipse cx="20" cy="100" rx="15" ry="24" fill="${skin}" stroke="#e0a060" stroke-width="1.5"/>
        <ellipse cx="180" cy="100" rx="15" ry="24" fill="${skin}" stroke="#e0a060" stroke-width="1.5"/>
      `;

      // Chin
      const chin = sex === 'neutral'
        ? `<path d="M78 158 Q100 178 122 158" fill="${skin}" stroke="#e0a060" stroke-width="1.5"/>` : '';

      // Eyes
      const leftEye = `
        <circle cx="70" cy="85" r="12" fill="white"/>
        <circle cx="70" cy="85" r="6" fill="#222"/>
        ${leftM.eyeshadow !== 'none' ? `<ellipse cx="70" cy="74" rx="16" ry="9" fill="${leftM.eyeshadow}" opacity="0.75"/>` : ''}
        ${sex === 'female' ? `
          <path d="M58 78 Q55 72 60 70" stroke="#222" stroke-width="1.8" fill="none"/>
          <path d="M65 76 Q64 70 69 69" stroke="#222" stroke-width="1.8" fill="none"/>
          <path d="M75 76 Q76 70 81 69" stroke="#222" stroke-width="1.8" fill="none"/>
        ` : ''}
        ${leftM.tear ? `<path d="M70 100 Q68 115 72 125" stroke="#74b9ff" stroke-width="3" fill="none"/>` : ''}
      `;
      const rightEye = `
        <circle cx="130" cy="85" r="12" fill="white"/>
        <circle cx="130" cy="85" r="6" fill="#222"/>
        ${rightM.eyeshadow !== 'none' ? `<ellipse cx="130" cy="74" rx="16" ry="9" fill="${rightM.eyeshadow}" opacity="0.75"/>` : ''}
        ${sex === 'female' ? `
          <path d="M142 78 Q145 72 140 70" stroke="#222" stroke-width="1.8" fill="none"/>
          <path d="M135 76 Q136 70 131 69" stroke="#222" stroke-width="1.8" fill="none"/>
          <path d="M125 76 Q124 70 119 69" stroke="#222" stroke-width="1.8" fill="none"/>
        ` : ''}
        ${rightM.tear ? `<path d="M130 100 Q132 115 128 125" stroke="#74b9ff" stroke-width="3" fill="none"/>` : ''}
      `;

      // Cheeks
      const cheeks = `
        ${leftM.cheek !== 'none' ? `<circle cx="52" cy="115" r="15" fill="${leftM.cheek}" opacity="0.7"/>` : ''}
        ${rightM.cheek !== 'none' ? `<circle cx="148" cy="115" r="15" fill="${rightM.cheek}" opacity="0.7"/>` : ''}
      `;

      // Nose
      let noseSVG = '';
      if (nose === 'round') noseSVG = `<circle cx="100" cy="110" r="18" fill="#ff1744"/>`;
      else if (nose === 'pointy') noseSVG = `<polygon points="100,95 84,128 116,128" fill="#ff1744"/>`;
      else if (nose === 'small') noseSVG = `<circle cx="100" cy="110" r="11" fill="#ff1744"/>`;
      else if (nose === 'button') noseSVG = `<circle cx="100" cy="110" r="14" fill="#e91e63"/>`;
      else if (nose === 'at') {
        noseSVG = `<text x="100" y="122" text-anchor="middle" font-size="42" font-weight="bold" fill="#ff1744" font-family="Arial">@</text>`;
      }

      // Mouth
      let mouthSVG = '';
      if (smile === 'closed') mouthSVG = `<path d="M70 140 Q100 158 130 140" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>`;
      else if (smile === 'open') mouthSVG = `<path d="M70 138 Q100 165 130 138" stroke="#222" stroke-width="4" fill="#c0392b"/><path d="M78 142 Q100 155 122 142" fill="#e74c3c"/>`;
      else if (smile === 'cheeky') mouthSVG = `<path d="M72 138 Q100 162 128 138" stroke="#222" stroke-width="5" fill="none"/><circle cx="62" cy="130" r="6" fill="#ff6b6b" opacity="0.6"/><circle cx="138" cy="130" r="6" fill="#ff6b6b" opacity="0.6"/>`;
      else if (smile === 'flat') mouthSVG = `<line x1="72" y1="142" x2="128" y2="142" stroke="#222" stroke-width="5" stroke-linecap="round"/>`;
      else if (smile === 'wobbly') mouthSVG = `<path d="M70 140 Q85 155 100 140 Q115 155 130 140" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>`;
      else if (smile === 'unsmiley') mouthSVG = `<path d="M75 145 Q100 135 125 145" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>`;
      else if (smile === 'sad') mouthSVG = `<path d="M72 150 Q100 130 128 150" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>`;
      else if (smile === 'angry') mouthSVG = `<path d="M70 145 Q100 130 130 145" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M60 75 L75 85" stroke="#222" stroke-width="4" stroke-linecap="round"/><path d="M140 75 L125 85" stroke="#222" stroke-width="4" stroke-linecap="round"/>`;

      // Speech bubble
      let bubbleSVG = '';
      if (showBubble) {
        bubbleSVG = `
          <g transform="translate(145, 15)">
            <path d="M10 40 Q0 20 20 10 L110 10 Q130 10 130 30 L130 55 Q130 70 110 70 L40 70 Q25 70 20 55 L10 40 Z"
                  fill="white" stroke="#222" stroke-width="2.5"/>
            <path d="M18 55 L5 80 L30 62" fill="white" stroke="#222" stroke-width="2.5"/>
            <text x="70" y="48" text-anchor="middle" font-size="13" font-family="Arial" fill="#111" font-weight="600">${bubbleText}</text>
          </g>
        `;
      }

      svg.innerHTML = `
        ${ears}
        ${headSVG}
        ${chin}
        ${hairSVG}
        ${cheeks}
        ${leftEye}
        ${rightEye}
        ${noseSVG}
        ${mouthSVG}
        ${bubbleSVG}
      `;
    }

    // Randomise
    function randomise() {
      const picks = (id) => {
        const el = document.getElementById(id);
        const opts = [...el.options];
        el.selectedIndex = Math.floor(Math.random() * opts.length);
      };
      picks('sex');
      picks('skinbase');
      picks('skintone');
      picks('faceshape');
      picks('hair');
      picks('haircolor');
      picks('makeup');
      picks('makeup-left');
      picks('makeup-right');
      picks('nose');
      picks('smile');
      document.getElementById('symmetrical').checked = Math.random() > 0.4;
      document.getElementById('bubble').checked = Math.random() > 0.6;
      const phrases = ['Hi!', 'Wow!', 'Oops', 'Hehe', 'Boo!', 'Yay!', 'Huh?', 'LOL', 'Ouch', 'Nice'];
      document.getElementById('bubble-text').value = phrases[Math.floor(Math.random()*phrases.length)];
      symmetrical.dispatchEvent(new Event('change'));
      draw();
    }

    // Build a clean, closed <svg> string (viewBox + circular clip already applied
    // by whoever draws it) so it can be used both for download and as a data URL.
    function serializeFace() {
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svg);
      return '<?xml version="1.0" standalone="no"?>\r\n' + source;
    }

    // Download PNG
    function downloadPNG() {
      const source = serializeFace();
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 600;
        canvas.height = 600;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0f3460';
        ctx.fillRect(0,0,600,600);
        ctx.drawImage(img, 0, 0, 600, 600);
        const a = document.createElement('a');
        a.download = 'clown-face.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = url;
    }

    // Save the current face into localStorage, shared (same-origin) with
    // index.html's Clown-Walk mode and snout-first.html's clown-markers.js.
    function saveAsClown() {
      const status = document.getElementById('saveStatus');
      try {
        const config = { symmetrical: symmetrical.checked, bubble: document.getElementById('bubble').checked, bubbleText: document.getElementById('bubble-text').value };
        FACE_FIELD_IDS.forEach(id => { config[id] = document.getElementById(id).value; });
        localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
        localStorage.setItem(SVG_KEY, 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(serializeFace()));
        status.textContent = '✅ Saved! Your live clown avatar will use this face.';
      } catch (e) {
        status.textContent = '⚠ Could not save (' + e.message + ')';
        status.style.color = '#ff6b6b';
        return;
      }
      status.style.color = '#7CFC98';
      setTimeout(() => { status.textContent = ''; }, 4000);
    }

    // Reload a previously saved face, if any, so this is safe to reopen
    // "from time to time" without starting from scratch.
    function loadSavedConfig() {
      let raw;
      try { raw = localStorage.getItem(CONFIG_KEY); } catch (e) { return; }
      if (!raw) return;
      try {
        const config = JSON.parse(raw);
        FACE_FIELD_IDS.forEach(id => { if (config[id] !== undefined) document.getElementById(id).value = config[id]; });
        symmetrical.checked = !!config.symmetrical;
        document.getElementById('bubble').checked = !!config.bubble;
        document.getElementById('bubble-text').value = config.bubbleText || '';
      } catch (e) { /* ignore corrupt saved config */ }
    }

    // Listeners
    document.querySelectorAll('select, #symmetrical, #bubble, #bubble-text').forEach(el => {
      el.addEventListener('change', draw);
      el.addEventListener('input', draw);
    });

    loadSavedConfig();
    symmetrical.dispatchEvent(new Event('change'));
    draw();
  </script>
</body>
</html>
